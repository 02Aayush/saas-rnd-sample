name: 4 - Test Django with Actions Secret Database URL

on:
  workflow_dispatch: 
  push: # git push
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 0
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # DJANGO_SECRET_KEY: not-good
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Django Secret Key
        run: |
          My_Gen_secret_key=$(openssl rand -base64 32)
          echo "DJANGO_SECRET_KEY=$My_Gen_secret_key" >> $GITHUB_ENV
      - name: Print Database URL
        run: |
          echo ${{ env.DATABASE_URL }}
          echo $DATABASE_URL
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django Tests
        working-directory: ./src
        run: |
          python manage.py test
