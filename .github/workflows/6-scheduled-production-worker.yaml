name: 6 - Scheduled Production Worker

# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1,3'
    - cron: '0 4 1 * *'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 0
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
      NEON_PROD_BRANCH: "production"
      GITHUB_CLIENT_ID: test-client-id # This is a dummy value for testing purposes. In a real workflow, you would use a secret or an environment variable to store sensitive information.
      GITHUB_CLIENT_SECRET: test-client-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Neon CLI
        run: |
          npm install -g neonctl
      - name: Databse URL Env Val for new Github Actions branch
        run: |
          # MY_NEON_CONN_STRING=$(neonctl connection-string --branch "${{ env.NEON_GITHUB_BRANCH }}" --project-id "${{ env.NEON_PROJECT_ID }}")
          # Use the provided NEON_DATABASE_NAME or default to "test_neondb"
          DB_NAME=${NEON_DATABASE_NAME:-test_neondb}
          MY_NEON_CONN_STRING=$(neonctl connection-string --branch "${{ env.NEON_PROD_BRANCH }}" --project-id "${{ env.NEON_PROJECT_ID }}" --database-name "$DB_NAME")
          echo "DATABASE_URL=$MY_NEON_CONN_STRING" >> $GITHUB_ENV
      - name: Setup Django Secret Key
        run: |
          My_Gen_secret_key=$(openssl rand -base64 32)
          echo "DJANGO_SECRET_KEY=$My_Gen_secret_key" >> $GITHUB_ENV
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django Migrate Database
        working-directory: ./src
        run: |
          python manage.py migrate
      - name: Django Users Sync Stripe Subscriptions
        if: github.event.schedule != '0 4 1 * *'
        working-directory: ./src
        run: |
          python manage.py sync_user_subs --day-start 0 --day-end 1
      - name: Django Users Clear Dangling Stripe Subscriptions
        working-directory: ./src
        if: github.event.schedule == '0 4 1 * *' # Run this step only on the first day of the month at 4:00 AM
        run: |
          python manage.py sync_user_subs --clear-dangling
